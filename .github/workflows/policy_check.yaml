name: Terraform OPA Policy Check

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'inputs/**'
      - 'policies/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  policy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached Terraform lock files
        id: cache-terraform-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            **/.terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Set up plugin cache config
        run: |
          bash scripts/auto_test/cache_setup.sh

      - name: Initialize Terraform providers
        run: |
          mkdir -p .terraform-init
          cat > .terraform-init/main.tf << 'EOF'
          terraform {
            required_providers {
              google = { source = "hashicorp/google", version = "~> 5.0" }
              google-beta = { source = "hashicorp/google-beta", version = "~> 5.0" }
            }
          }
          EOF
          cd .terraform-init
          terraform init -backend=false
 
      - name: Run policy checks (Terraform + OPA)
        run: |
          python3 scripts/auto_test/auto_test.py \
            --inputs inputs/gcp \
            --policies policies/gcp
            --verbose

      - name: Save Terraform lock files
        id: cache-terraform-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            **/.terraform.lock.hcl
          key: ${{ steps.cache-terraform-restore.outputs.cache-primary-key }}
          restore-keys: |
            Linux-terraform-